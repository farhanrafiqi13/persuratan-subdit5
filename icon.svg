<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <!-- Border outline -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />
  <!-- Stylized Document & Airplane -->
  <g filter="url(#shadow)" transform="translate(76, 76)">
    <!-- Document background -->
    <rect x="40" y="30" width="230" height="300" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-width="6" />
    <!-- Document lines -->
    <line x1="80" y1="90" x2="220" y2="90" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <line x1="80" y1="130" x2="200" y2="130" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <line x1="80" y1="170" x2="160" y2="170" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <!-- Paper Plane symbol -->
    <path d="M120 280 L290 80 L320 260 L240 220 L180 270 Z" fill="url(#planeGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    <path d="M240 220 L290 80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
  </g>
  <!-- Subdit 5 Badge -->
  <rect x="136" y="400" width="240" height="52" rx="26" fill="#0369a1" />
  <text x="256" y="435" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="2">SUBDIT 5</text>
</svg>