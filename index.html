<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Persuratan & BA Subdit 5 - 2026</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- Toast Notification Container -->
  <div id="toastBox" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Navbar -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-inner">
          <i class="fa-solid fa-plane-departure text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg tracking-tight">Persuratan Subdit 5</h1>
          <p class="text-xs text-slate-400">Direktorat Bandar Udara • 2026</p>
        </div>
      </div>

      <!-- Tab Switcher -->
      <nav class="flex bg-slate-800/80 p-1 rounded-xl border border-slate-700/60">
        <button onclick="switchTab('surat-keluar')" id="tabBtnSurat" 
                class="px-4 py-2 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white shadow transition-all duration-200">
          <i class="fa-solid fa-paper-plane mr-1.5"></i>Surat Keluar
        </button>
        <button onclick="switchTab('ba-jaster')" id="tabBtnBA" 
                class="px-4 py-2 text-xs sm:text-sm font-medium rounded-lg text-slate-300 hover:text-white transition-all duration-200">
          <i class="fa-solid fa-file-circle-check mr-1.5"></i>BA Jasa Terkait
        </button>
      </nav>
    </div>
  </header>

  <!-- Content Body -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">

    <!-- Action Toolbar -->
    <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-6">
      <div class="relative flex-1 max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" onkeyup="handleFilter()" 
               placeholder="Cari perihal, nomor, PT, atau PIC..." 
               class="w-full pl-10 pr-4 py-2 text-sm rounded-xl border border-slate-200 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>

      <div class="flex items-center gap-2">
        <button onclick="loadData()" title="Segarkan Data" class="px-3.5 py-2 bg-white border border-slate-200 hover:bg-slate-100 rounded-xl text-slate-600 shadow-sm text-sm transition">
          <i id="refreshIcon" class="fa-solid fa-rotate-right"></i>
        </button>
        <button onclick="openModal()" class="flex-1 sm:flex-none inline-flex items-center justify-center space-x-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-md transition">
          <i class="fa-solid fa-plus"></i>
          <span id="btnAddText">Catat Surat Keluar</span>
        </button>
      </div>
    </div>

    <!-- Section 1: Surat Keluar Table -->
    <section id="secSuratKeluar" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold border-b border-slate-200">
            <tr>
              <th class="px-4 py-3.5 w-14 text-center">No</th>
              <th class="px-4 py-3.5 whitespace-nowrap">Tanggal</th>
              <th class="px-4 py-3.5 whitespace-nowrap">Nomor Surat</th>
              <th class="px-4 py-3.5 min-w-[280px]">Perihal</th>
              <th class="px-4 py-3.5 whitespace-nowrap">Konseptor</th>
              <th class="px-4 py-3.5 text-center whitespace-nowrap">ND Kasubdit</th>
              <th class="px-4 py-3.5 text-center whitespace-nowrap">Surat Direktur</th>
            </tr>
          </thead>
          <tbody id="tbodySuratKeluar" class="divide-y divide-slate-100 text-slate-700">
            <tr><td colspan="7" class="px-4 py-12 text-center text-slate-400">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Section 2: BA Jasa Terkait Table -->
    <section id="secBA" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold border-b border-slate-200">
            <tr>
              <th class="px-4 py-3.5 w-14 text-center">No</th>
              <th class="px-4 py-3.5 whitespace-nowrap">Tanggal</th>
              <th class="px-4 py-3.5 whitespace-nowrap">Nomor Berita Acara</th>
              <th class="px-4 py-3.5 min-w-[220px]">Badan Usaha (PT)</th>
              <th class="px-4 py-3.5 min-w-[200px]">Bandara</th>
              <th class="px-4 py-3.5 min-w-[180px]">Tim PIC</th>
              <th class="px-4 py-3.5 text-center whitespace-nowrap">Dokumen BA</th>
            </tr>
          </thead>
          <tbody id="tbodyBA" class="divide-y divide-slate-100 text-slate-700">
            <tr><td colspan="7" class="px-4 py-12 text-center text-slate-400">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal Input Dialog -->
  <div id="formModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <div>
          <h3 id="modalTitle" class="font-bold text-slate-800 text-base">Input Data</h3>
          <p class="text-xs text-slate-400">Dokumen otomatis tersimpan ke subfolder bulan di Drive</p>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition flex items-center justify-center">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="mainForm" onsubmit="handleSubmit(event)" class="mt-4 space-y-4">
        <div id="dynamicFormFields" class="space-y-4"></div>

        <div class="pt-4 border-t border-slate-100 flex justify-end space-x-3">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition">Batal</button>
          <button type="submit" id="btnSubmit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-md transition flex items-center">
            <span>Simpan</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // URL Backend Web App Google Apps Script
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzFk3Lgw0kXLpqhFgrBgVDOZyCKYwANppBq6-AtVggCK5EzJYKsFm39Tyz07AN8JqG0/exec";

    let currentTab = 'surat-keluar';
    let dataSurat = [];
    let dataBA = [];

    const PIC_OPTIONS = ["Tony Fredrik", "Novrinanda", "Hanif A", "Aspar", "Farhan Rafiqi", "Andy Bastian", "Dedi Santoso", "Rosadianita", "Sadewo"];
    const BANDARA_OPTIONS = [
      { kode: "CGK", nama: "Soekarno-Hatta (Tangerang)" },
      { kode: "HLP", nama: "Halim Perdanakusuma (Jakarta)" },
      { kode: "GTO", nama: "Djalaluddin (Gorontalo)" },
      { kode: "TIM", nama: "Mozes Kilangin (Timika)" },
      { kode: "BDO", nama: "Husein Sastranegara (Bandung)" },
      { kode: "TRK", nama: "Juwata (Tarakan)" },
      { kode: "BWX", nama: "Banyuwangi" },
      { kode: "PLM", nama: "Sultan Mahmud Badaruddin II (Palembang)" },
      { kode: "SRG", nama: "Jenderal Ahmad Yani (Semarang)" },
      { kode: "LBJ", nama: "Komodo (Labuan Bajo)" },
      { kode: "UPG", nama: "Sultan Hasanuddin (Makassar)" },
      { kode: "KNO", nama: "Kualanamu (Medan)" },
      { kode: "BIK", nama: "Frans Kaisiepo (Biak)" }
    ];

    function showToast(message, type = 'success') {
      const box = document.getElementById('toastBox');
      const toast = document.createElement('div');
      const isOk = type === 'success';
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-xs sm:text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${
        isOk ? 'bg-slate-900 border-slate-700 text-white' : 'bg-red-600 border-red-700 text-white'
      }`;
      toast.innerHTML = `<i class="fa-solid ${isOk ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-white'} text-base"></i><span>${message}</span>`;
      box.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function formatDate(val) {
      if (!val) return '-';
      const d = new Date(val);
      return isNaN(d.getTime()) ? val : d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function switchTab(tab) {
      currentTab = tab;
      const isSurat = tab === 'surat-keluar';

      document.getElementById('secSuratKeluar').classList.toggle('hidden', !isSurat);
      document.getElementById('secBA').classList.toggle('hidden', isSurat);

      document.getElementById('tabBtnSurat').className = isSurat
        ? "px-4 py-2 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white shadow transition-all duration-200"
        : "px-4 py-2 text-xs sm:text-sm font-medium rounded-lg text-slate-300 hover:text-white transition-all duration-200";

      document.getElementById('tabBtnBA').className = !isSurat
        ? "px-4 py-2 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white shadow transition-all duration-200"
        : "px-4 py-2 text-xs sm:text-sm font-medium rounded-lg text-slate-300 hover:text-white transition-all duration-200";

      document.getElementById('btnAddText').innerText = isSurat ? "Catat Surat Keluar" : "Catat BA Jasa Terkait";
      document.getElementById('searchInput').value = "";
      handleFilter();
    }

    async function loadData() {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('fa-spin');

      try {
        const [resSurat, resBA] = await Promise.all([
          fetch(`${GAS_API_URL}?action=getSuratKeluar`).then(r => r.json()),
          fetch(`${GAS_API_URL}?action=getBAJasaTerkait`).then(r => r.json())
        ]);

        dataSurat = (resSurat.data || []).filter(r => r[0] !== 'No.' && r[0] !== 'No');
        dataBA = (resBA.data || []).filter(r => r[0] !== 'No.' && r[0] !== 'No');
        renderSurat(dataSurat);
        renderBA(dataBA);
      } catch (err) {
        showToast("Gagal menyinkronkan data: " + err.message, "error");
      } finally {
        if (icon) icon.classList.remove('fa-spin');
      }
    }

    function renderSurat(rows) {
      const tbody = document.getElementById('tbodySuratKeluar');
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-10 text-center text-slate-400">Tidak ada data persuratan ditemukan</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map(r => `
        <tr class="hover:bg-slate-50 transition border-b border-slate-100">
          <td class="px-4 py-3 text-center font-mono text-xs text-slate-400">${r[0]}</td>
          <td class="px-4 py-3 whitespace-nowrap text-xs text-slate-600">${formatDate(r[1])}</td>
          <td class="px-4 py-3 whitespace-nowrap font-semibold text-slate-900">${r[2] || '-'}</td>
          <td class="px-4 py-3 text-slate-700 leading-snug">${r[3] || '-'}</td>
          <td class="px-4 py-3 whitespace-nowrap"><span class="px-2 py-1 bg-slate-100 text-slate-700 rounded-md text-xs font-medium">${r[6] || '-'}</span></td>
          <td class="px-4 py-3 text-center whitespace-nowrap">
            ${r[7] ? `<a href="${r[7]}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 text-xs font-medium bg-blue-50 px-2.5 py-1 rounded-md"><i class="fa-solid fa-file-pdf"></i> Draf ND</a>` : '<span class="text-slate-300">-</span>'}
          </td>
          <td class="px-4 py-3 text-center whitespace-nowrap">
            ${r[8] ? `<a href="${r[8]}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-emerald-600 hover:text-emerald-800 text-xs font-medium bg-emerald-50 px-2.5 py-1 rounded-md"><i class="fa-solid fa-file-signature"></i> Surat</a>` : '<span class="text-slate-300">-</span>'}
          </td>
        </tr>
      `).join('');
    }

    function renderBA(rows) {
      const tbody = document.getElementById('tbodyBA');
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-10 text-center text-slate-400">Tidak ada data Berita Acara ditemukan</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map(r => `
        <tr class="hover:bg-slate-50 transition border-b border-slate-100">
          <td class="px-4 py-3 text-center font-mono text-xs text-slate-400">${r[0]}</td>
          <td class="px-4 py-3 whitespace-nowrap text-xs text-slate-600">${formatDate(r[1])}</td>
          <td class="px-4 py-3 whitespace-nowrap font-semibold text-slate-900">${r[2] || '-'}</td>
          <td class="px-4 py-3 font-medium text-slate-800">${r[3] || '-'}</td>
          <td class="px-4 py-3 text-xs text-slate-600">${r[4] || '-'}</td>
          <td class="px-4 py-3 text-xs text-slate-500 whitespace-pre-line">${r[6] || '-'}</td>
          <td class="px-4 py-3 text-center whitespace-nowrap">
            ${r[5] ? `<a href="${r[5]}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-rose-600 hover:text-rose-800 text-xs font-medium bg-rose-50 px-2.5 py-1 rounded-md"><i class="fa-solid fa-file-pdf"></i> Dokumen</a>` : '<span class="text-slate-300">-</span>'}
          </td>
        </tr>
      `).join('');
    }

    function openModal() {
      const container = document.getElementById('dynamicFormFields');
      const isSurat = currentTab === 'surat-keluar';
      const todayStr = new Date().toISOString().split('T')[0];

      document.getElementById('modalTitle').innerText = isSurat ? "Catat Surat Keluar Baru" : "Catat Berita Acara Jasa Terkait";

      if (isSurat) {
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Surat *</label>
              <input type="date" name="tanggal" value="${todayStr}" required class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Konseptor (PIC) *</label>
              <select name="konseptor" required class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                ${PIC_OPTIONS.map(p => `<option value="${p}">${p}</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Perihal Surat *</label>
            <textarea name="perihal" rows="3" required placeholder="Tuliskan perihal surat keluar..." class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
          </div>
          <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200/80 space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                <i class="fa-solid fa-folder-tree text-blue-500 mr-1"></i>Upload Nota Dinas Kasubdit (PDF)
              </label>
              <input type="file" id="fileND" accept=".pdf" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                <i class="fa-solid fa-folder-tree text-emerald-500 mr-1"></i>Upload Surat Direktur / Final (PDF)
              </label>
              <input type="file" id="fileSurat" accept=".pdf" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-100 file:text-emerald-700 hover:file:bg-emerald-200">
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal BA *</label>
              <input type="date" name="tanggal" value="${todayStr}" required class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Lokasi Bandara *</label>
              <select name="bandaraSelect" id="bandaraSelect" required class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                ${BANDARA_OPTIONS.map(b => `<option value="${b.kode}">${b.nama} (${b.kode})</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Badan Usaha (PT) *</label>
            <input type="text" name="namaPT" required placeholder="Contoh: PT Gapura Angkasa" class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tim PIC Pemeriksa *</label>
            <input type="text" name="picList" placeholder="1. Andy Bastian  2. Tony Fredrik" required class="w-full text-sm border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200/80">
            <label class="block text-xs font-semibold text-slate-700 mb-1">
              <i class="fa-solid fa-folder-tree text-rose-500 mr-1"></i>Upload Berita Acara (PDF)
            </label>
            <input type="file" id="fileBA" accept=".pdf" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-rose-100 file:text-rose-700 hover:file:bg-rose-200">
          </div>
        `;
      }
      document.getElementById('formModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('formModal').classList.add('hidden');
      document.getElementById('mainForm').reset();
    }

    function readFileAsBase64(fileInputId) {
      const el = document.getElementById(fileInputId);
      if (!el || !el.files || !el.files[0]) return Promise.resolve(null);
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(el.files[0]);
      });
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...`;

      const form = e.target;
      try {
        let payload = {};

        if (currentTab === 'surat-keluar') {
          const [base64ND, base64Surat] = await Promise.all([
            readFileAsBase64('fileND'),
            readFileAsBase64('fileSurat')
          ]);

          payload = {
            action: "addSuratKeluar",
            tanggal: form.tanggal.value,
            konseptor: form.konseptor.value,
            perihal: form.perihal.value,
            fileNotaKasubdit: base64ND,
            fileSuratDirektur: base64Surat
          };
        } else {
          const base64BA = await readFileAsBase64('fileBA');
          const selBandara = document.getElementById('bandaraSelect');

          payload = {
            action: "addBAJasaTerkait",
            tanggal: form.tanggal.value,
            namaPT: form.namaPT.value,
            kodeBandara: selBandara.value,
            lokasiBandara: selBandara.options[selBandara.selectedIndex].text,
            picList: form.picList.value,
            fileBA: base64BA
          };
        }

        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        }).then(r => r.json());

        if (res.status === 'success') {
          showToast(res.message);
          closeModal();
          loadData();
        } else {
          showToast("Galat: " + res.message, "error");
        }
      } catch (err) {
        showToast("Gagal menyimpan: " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `Simpan`;
      }
    }

    function handleFilter() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      if (currentTab === 'surat-keluar') {
        const filtered = dataSurat.filter(r => 
          String(r[2] || '').toLowerCase().includes(q) || 
          String(r[3] || '').toLowerCase().includes(q) || 
          String(r[6] || '').toLowerCase().includes(q)
        );
        renderSurat(filtered);
      } else {
        const filtered = dataBA.filter(r => 
          String(r[2] || '').toLowerCase().includes(q) || 
          String(r[3] || '').toLowerCase().includes(q) || 
          String(r[4] || '').toLowerCase().includes(q) ||
          String(r[6] || '').toLowerCase().includes(q)
        );
        renderBA(filtered);
      }
    }

    // Registrasi PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW register failed:', err));
      });
    }

    window.onload = loadData;
  </script>
</body>
</html>
